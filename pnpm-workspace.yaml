packages:
  - apps/web

# pnpm blocks dependency build scripts by default; only these may run them (DEC-018).
# pnpm 11 replaced onlyBuiltDependencies with allowBuilds.
allowBuilds:
  esbuild: true
  sharp: true
  # Optional native-binary postinstall of eslint-config-next's resolver; the prebuilt optional dep covers Windows and Linux.
  unrs-resolver: false
