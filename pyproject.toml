# uv workspace root (virtual: no [project] of its own). Install everything with `uv sync --all-packages`.

[tool.uv.workspace]
members = ["apps/api", "apps/workers", "packages/core", "packages/ml", "packages/sources"]

[tool.uv.sources]
pulso-core = { workspace = true }
pulso-ml = { workspace = true }
pulso-sources = { workspace = true }

[dependency-groups]
dev = ["mypy>=2.4", "pytest>=9.1", "ruff>=0.17"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["apps/*/src", "packages/*/src", "infra/scripts"]  # first-party imports for isort

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["apps", "packages", "infra/scripts"]

[[tool.mypy.overrides]]
# boto3 ships no type hints; add types-boto3 if S3 code grows beyond the helper.
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["apps", "packages", "infra"]
pythonpath = ["infra/scripts"]
addopts = ["--import-mode=importlib"]
