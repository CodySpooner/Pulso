[project]
name = "pulso-core"
version = "0.0.0"
description = "Shared Pulso Python: settings and the S3 helper."
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.18,<2",
    "boto3>=1.43",
    "pgvector>=0.4,<0.5",
    "psycopg[binary]>=3.3,<4",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.0,<2.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"
