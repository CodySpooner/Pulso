# Rule-based category mapping (Phase 2 M-6, DEC-253). Reviewed configuration, not data.
#
# Values are Google Product Taxonomy paths exactly as in google_product_taxonomy.txt; loading
# raises on a path the file lacks. Keys match case-insensitively with spacing collapsed.
#
# A source category resolves, in order: this file's table for its source, then any Google path or
# unique Google category name, each tried on the whole value and then on its last "›" / ">"
# segment. A title keyword that sits under the source category refines it.

