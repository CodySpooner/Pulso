[project]
name = "pulso-ml"
version = "0.0.0"
description = "Pulso feature store, training, backtests and scoring (Phase 2+)."
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.5,<3",
    "pillow>=13,<14",
    "pulso-core",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"
