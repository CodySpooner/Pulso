[project]
name = "pulso-ml"
version = "0.0.0"
description = "Pulso feature store, training, backtests and scoring (Phase 2+)."
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.5,<3",
    "pillow>=13,<14",
    "pulso-core",
]

[project.optional-dependencies]
# OpenCLIP embeddings (DEC-269): only the ml worker installs these; CPU torch from pytorch-cpu.
clip = [
    "open-clip-torch>=3.3,<4",
    "torch>=2.9,<3",
    "torchvision>=0.24,<1",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"
