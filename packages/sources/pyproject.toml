[project]
name = "pulso-sources"
version = "0.0.0"
description = "Pulso source adapters, one per data source (Phase 1+)."
requires-python = ">=3.14,<3.15"
dependencies = [
    "pillow>=13,<14",
    "pulso-core",
    "pulso-ml",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"
