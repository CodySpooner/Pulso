# Default: dev infrastructure (DEC-012). Profile collector adds the built workers and Beat.
# Web, API and workers run natively. Start with `pnpm infra:up`, which passes `--env-file .env`
# from the repo root. Every worktree shares this one `pulso` project, each with its own database
# and Redis DB (infra/scripts/worktree_env.py). The collector host runs the same file as the
# separate project `pulso-collector` with its own env file (DEC-013); agents never touch that one.
# Image tags were checked on Docker Hub on 2026-10-22 (docs/DECISIONS.md DEC-049).
name: pulso

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-collector: &collector
  profiles: [collector]
  image: pulso-collector-worker
  build:
    context: ..
    dockerfile: infra/docker/worker.Dockerfile
  # Only this file supplies live/scheduler flags; shell and dev flags are not forwarded.
  # Optional for config validation; collector commands require it before any operation.
  env_file:
    - path: ../.env.collector
      required: false
      format: raw
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    s3: { condition: service_healthy }
  restart: unless-stopped
  logging: *logging

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    command: ["postgres", "-c", "dynamic_shared_memory_type=mmap"] # HNSW index builds need mmap
    environment:
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      POSTGRES_DB: pulso
    ports: ["127.0.0.1:${PG_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql"] # PG18 images keep PGDATA under /var/lib/postgresql/18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulso -d pulso"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:8.8.3-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging

  s3:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000" # S3 API
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001" # web console
    volumes: ["s3data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  worker:
    <<: *collector

  # Explicit one-shot only: the guarded command verifies a backup before invoking this.
  migrate:
    <<: *collector
    profiles: [collector-tools]
    image: pulso-collector-api
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    restart: "no"

  worker-ops:
    <<: *collector
    command: ["celery", "-A", "pulso_workers.celery_app:app", "worker", "-Q", "ops", "--loglevel=INFO"]

  beat:
    <<: *collector
    command: ["celery", "-A", "pulso_workers.celery_app:app", "beat", "--loglevel=INFO", "--schedule=/home/pulso/schedule"]
    volumes: ["beatdata:/home/pulso"]

volumes:
  pgdata: {}
  redisdata: {}
  s3data: {}
  beatdata: {}
